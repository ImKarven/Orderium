name: Deploy docs

on:
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs source
        uses: actions/checkout@v4
        with:
          repository: ImKarven/orderium-docs
          ref: master
          path: docs-src
          token: ${{ secrets.DOCS_READ_TOKEN }}

      - uses: withastro/action@v3
        with:
          path: ./docs-src

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
